[project]
name = "saas-experimental"
version = "0.1.0"
description = "SAAS_experimental: FastAPI + ASP.NET Core + React"
authors = [{ name = "Benedict Thekkel", email = "bthekkel1@gmail.com" }]
requires-python = ">=3.14"
# Installs catalog, common and Django's instances (#51) into one dev environment. The
# running `instances` is .NET (instances_NET, #45), outside uv. Images install one
# service each: `uv sync --package catalog`.
dependencies = ["catalog", "instances-django", "common"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "catalog", "instances_Django"]

[tool.uv.sources]
catalog = { workspace = true }
instances-django = { workspace = true }
common = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
  "mypy>=2.0",
  "pytest-cov>=7.1",
  "flower>=2.2",
  "pytest-mock>=3.16",
  "pypdf>=6.0",
  # instances_Django's suite (#51)
  "pytest-django>=4.14",
  "factory-boy>=3.3",
  "faker>=40.0",
  "freezegun>=1.5",
]



# Repo-level checks only. catalog has its own config, so run `uv run pytest catalog`,
# `uv run pytest tests`, `uv run pytest parity` and `uv run pytest parity_instances`.
[tool.pytest.ini_options]
addopts = "--tb=short --show-capture=no -ra"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
exclude = ["migrations", ".venv", "static", "media"]
target-version = "py314"
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "I",   # isort
  "B",   # flake8-bugbear
  "PT",  # flake8-pytest-style
  "Q",   # flake8-quotes
  "C4",  # flake8-comprehensions
  "C90", # mccabe (complexity)
  "N",   # pep8-naming
  "PLE", # pylint error
  "PLW", # pylint warning
  "RUF", # Ruff-specific rules
  "S",   # flake8-bandit (security)
  "SIM", # flake8-simplify
  "T10", # flake8-debugger
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "ERA", # eradicate (commented out code)
  "PIE", # flake8-pie
  "ISC", # flake8-implicit-str-concat
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  # "A",    # flake8-builtins
  # "ANN",  # flake8-annotations - enable when ready for full type hints
  # "DTZ",  # flake8-datetimez
  # "D",    # pydocstyle - enable when ready for full docstrings
  # "EM",   # flake8-errmsg
  # "G",    # flake8-logging-format
  # "PLR",  # pylint refactor - can be noisy
  # "TRY",  # tryceratops
]

ignore = [
  "S101",   # Use of assert detected (pytest uses assert)
  "S105",   # Possible hardcoded password
  "S106",   # Possible hardcoded password
  "RUF012", # Mutable class attributes
  "N818",   # Exception name should be named with an Error suffix
]

[tool.ruff.lint.isort]
# Its package directory sits one level down, so ruff can't find its submodules.
known-first-party = ["catalog"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "ARG", "PLR2004"]
"*/migrations/*" = ["ALL"]
# instances_Django's settings profiles build on one another with star imports (#51).
"instances_Django/**/settings/*" = ["F405", "F403"]


[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(
    \.venv
  | migrations
  | static
  | media
  | .*\.pyi
)/
'''
