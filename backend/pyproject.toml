[project]
name = "test-repo"
version = "0.1.0"
description = "test_repo: Django REST Framework + React"
authors = [{ name = "Benedict Thekkel", email = "bthekkel1@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "django ~=6.0",
  "djangorestframework ~=3.18",
  "djangorestframework-simplejwt ~=5.5",
  "django-cors-headers ~=4.9",
  "django-environ ~=0.14",
  "gunicorn ~=26.2",
  "psycopg[binary] ~=3.3",
  "celery[redis] ~=5.6",
  "django-celery-results>=2.6.0",
  "django-celery-beat>=2.9.0",
]

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "apps"]

[tool.hatch.metadata]
allow-direct-references = true


[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-django>=4.14",
  "factory-boy>=3.3",
  "faker>=40.0",
  "freezegun>=1.5",
  "ruff>=0.17",
  "mypy>=2.0",
  "django-stubs[compatible-mypy]>=6.1",
  "djangorestframework-stubs[compatible-mypy]>=3.18",
  "pytest-cov>=7.1",
  "flower>=2.2",
  "pytest-mock>=3.16",
]


[tool.pytest.ini_options]
log_cli = false
log_cli_level = "INFO"
addopts = "--tb=short --show-capture=no -ra"
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["*test*.py", "tests/*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["apps", "tests"]
console_output_style = "progress"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests requiring external APIs",
  "development: marks tests that only run with development settings",
]


[tool.ruff]
line-length = 88
exclude = ["migrations", ".venv", "static", "media"]
target-version = "py314"
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "I",   # isort
  "B",   # flake8-bugbear
  "PT",  # flake8-pytest-style
  "Q",   # flake8-quotes
  "C4",  # flake8-comprehensions
  "C90", # mccabe (complexity)
  "DJ",  # flake8-django
  "N",   # pep8-naming
  "PLE", # pylint error
  "PLW", # pylint warning
  "RUF", # Ruff-specific rules
  "S",   # flake8-bandit (security)
  "SIM", # flake8-simplify
  "T10", # flake8-debugger
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "ERA", # eradicate (commented out code)
  "PIE", # flake8-pie
  "ISC", # flake8-implicit-str-concat
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  # "A",    # flake8-builtins - may conflict with Django
  # "ANN",  # flake8-annotations - enable when ready for full type hints
  # "DTZ",  # flake8-datetimez - Django handles timezone well
  # "D",    # pydocstyle - enable when ready for full docstrings
  # "EM",   # flake8-errmsg
  # "G",    # flake8-logging-format
  # "PLR",  # pylint refactor - can be noisy
  # "TRY",  # tryceratops
]

ignore = [
  "S101",   # Use of assert detected (pytest uses assert)
  "S105",   # Possible hardcoded password
  "S106",   # Possible hardcoded password
  "DJ001",  # Avoid using null=True on string-based fields
  "RUF012", # Mutable class attributes
  "N818",   # Exception name should be named with an Error suffix
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "ARG", "PLR2004"]
"*/migrations/*" = ["ALL"]
"manage.py" = ["T20"]
"*/settings/*" = ["F405", "F403"]


[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(
    \.venv
  | migrations
  | static
  | media
  | .*\.pyi
)/
'''
