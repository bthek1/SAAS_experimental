[project]
name = "catalog"
version = "0.1.0"
description = "catalog on FastAPI: types, accounts and the outbox (#35)"
requires-python = ">=3.14"
dependencies = [
  # Only for common.dev_keys, the published dev JWT pair both services share.
  "common",
  "fastapi ~=0.120",
  "pydantic-settings ~=2.11",
  "email-validator ~=2.3",
  "sqlalchemy[asyncio] ~=2.0",
  "alembic ~=1.17",
  "psycopg[binary] ~=3.3",
  "pyjwt[crypto] ~=2.10",
  "redis ~=6.4",
  "httpx ~=0.28",
  "prometheus-client ~=0.23",
  "uvicorn[standard] ~=0.38",
  "uvicorn-worker ~=0.4",
  "gunicorn ~=26.2",
  "celery[redis] ~=5.6",
  "rich ~=14.0",
  "sqladmin[full] ~=0.21",
  "itsdangerous ~=2.2",
]

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catalog", "catalog.routers"]

[tool.uv.sources]
common = { workspace = true }

[tool.pytest.ini_options]
addopts = "--tb=short --show-capture=no -ra -p no:django"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
