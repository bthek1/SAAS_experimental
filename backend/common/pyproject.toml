[project]
name = "common"
version = "0.1.0"
description = "What catalog shares with the repo's tests: the published dev JWT pair and gunicorn settings"
requires-python = ">=3.14"
# gunicorn_conf.py imports prometheus_client only inside a hook, from catalog's environment.
dependencies = []

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common"]
