# Generated by infra/gateway/build_nginx.py from routes.json. Do not edit.
events {
    worker_connections 4096;
}

http {
    access_log off;
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=5s;

    upstream catalog {
        zone catalog 64k;
        server catalog:8000 resolve;
        keepalive 64;
        keepalive_timeout 60s;
    }
    upstream instances {
        zone instances 64k;
        server instances:8000 resolve;
        keepalive 64;
        keepalive_timeout 60s;
    }

    server {
        listen 8000;

        # The original Host: paginated `next` links are absolute URLs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        # A stopped service is a quick 502 rather than a client left waiting.
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;

        location ^~ /api/token/ {
            proxy_pass http://catalog;
        }
        location ^~ /api/accounts/ {
            proxy_pass http://catalog;
        }
        location ^~ /api/health/ {
            proxy_pass http://catalog;
        }
        location ^~ /api/tasks/ {
            proxy_pass http://catalog;
        }
        location ^~ /api/questionnaire-types/ {
            proxy_pass http://catalog;
        }
        location ^~ /api/battery-types/ {
            proxy_pass http://catalog;
        }
        location ^~ /admin/ {
            proxy_pass http://catalog;
        }
        location ^~ /static/ {
            proxy_pass http://catalog;
        }
        location ^~ /api/questionnaires/ {
            proxy_pass http://instances;
        }
        location ^~ /api/batteries/ {
            proxy_pass http://instances;
        }
        location ^~ /api/dashboard/ {
            proxy_pass http://instances;
        }
        location ^~ /instances-admin/ {
            proxy_pass http://instances;
        }
        location ^~ /instances-static/ {
            proxy_pass http://instances;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Not found."}';
        }
    }
}
