# Provisioned datasource (#9). The fixed uid is what every dashboard references.
# PROMETHEUS_URL: http://prometheus:9090 in the local compose stack, http://localhost:9090
# on saas-monitor (infra/ansible/roles/monitor). Grafana expands env vars here.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
