# Prometheus for the local load-test stack (#9, infra/docker/docker-compose.loadtest.yml).
# k6 results arrive by remote write (--web.enable-remote-write-receiver), not by scrape.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Each service directly: the gateway never routes /metrics. It answers only peers in
  # METRICS_ALLOWED_CIDRS (Prometheus's fixed address).
  - job_name: django
    static_configs:
      - targets: ["catalog.loadtest.internal:8000"]
        labels:
          instance: catalog
          service: catalog
      - targets: ["instances.loadtest.internal:8000"]
        labels:
          instance: instances
          service: instances

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          instance: redis
