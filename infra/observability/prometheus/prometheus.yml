# Prometheus for the local load-test stack (#9, infra/docker/docker-compose.loadtest.yml).
# k6 results arrive by remote write (--web.enable-remote-write-receiver), not by scrape.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # /metrics answers only peers in METRICS_ALLOWED_CIDRS (the compose subnet).
  - job_name: django
    static_configs:
      - targets: ["api.loadtest.internal:8000"]
        labels:
          instance: backend

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          instance: redis
