# Alert rules (#9). Shown in Prometheus and Grafana; nothing delivers them yet.
groups:
  - name: loadtest
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"

      # Needs postgres_exporter (saas-db on the LXC deploy); inactive on the local stack.
      - alert: PostgresConnectionsHigh
        expr: sum by (instance) (pg_stat_activity_count) > 0.8 * max by (instance) (pg_settings_max_connections)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Postgres on {{ $labels.instance }} is above 80 % of max_connections"

      # Requests still succeed (the cache fails open), but every one reaches the database.
      - alert: CacheErrors
        expr: sum(rate(app_cache_requests_total{result="error"}[1m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The API cannot reach its Redis cache"

      # Respondents are unaffected, but instances serves old definitions and deactivated users
      # keep access. See "A stuck outbox" in README.md.
      - alert: OutboxStuck
        expr: max(app_outbox_oldest_pending_seconds) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Type and user events have not reached instances for over a minute"

