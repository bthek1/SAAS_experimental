# Local load-test stack (#9). Paths are relative to this file. Run via `just loadtest-up`,
# `just k6 <scenario>` and `just loadtest-down`, which pass `--env-file .env` and
# `-p <repo-dir-name>-loadtest`, so nothing here touches the dev stack's containers or volumes.
#
# catalog and instances: the prod images under gunicorn with core.settings.loadtest, behind the
# gateway, so k6 measures production code, not runserver. Prometheus scrapes each service's
# /metrics directly and receives k6's results by remote write. Grafana shows both. Every host
# port is bound to 127.0.0.1. Needs JWT_SIGNING_KEY and JWT_VERIFYING_KEY in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - loadtest_postgres:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appuser", "-d", "appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  instances_db:
    image: postgres:16
    environment:
      POSTGRES_DB: instancesdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - loadtest_instances_postgres:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appuser", "-d", "instancesdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # instances on MongoDB instead (#29), not published. Started only with
  # COMPOSE_PROFILES=mongo, and used only with LOADTEST_INSTANCES_DATABASE_URL set:
  #   COMPOSE_PROFILES=mongo LOADTEST_INSTANCES_DATABASE_URL='mongodb://instances_mongo:27017/instancesdb?replicaSet=rs0&directConnection=true' just loadtest-up
  instances_mongo:
    image: mongo:8
    profiles: [mongo]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - loadtest_instances_mongo:/data/db
    healthcheck:
      # Also initiates the replica set on first start.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache only, not published. Same settings as saas-cache on the LXC deploy.
  redis:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  catalog:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/catalog.prod.Dockerfile
    # gunicorn reads gunicorn.conf.py (multiprocess metrics); flags win over it.
    # adopt_monolith_db does nothing unless this volume predates the split (#13).
    command: >-
      sh -c "python manage.py adopt_monolith_db
      && python manage.py migrate --noinput
      && exec gunicorn --bind :8000 --workers ${LOADTEST_WORKERS:-2} core.wsgi"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.loadtest
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      INSTANCES_DATABASE_URL: postgres://appuser:apppassword@instances_db:5432/instancesdb
      CACHE_REDIS_URL: redis://redis:6379/1
      # The names here are private by suffix, which core.settings.loadtest requires of every entry.
      ALLOWED_HOSTS: localhost,127.0.0.1,api.loadtest.internal,catalog.loadtest.internal,instances.loadtest.internal
      CATALOG_INTERNAL_URL: http://catalog.loadtest.internal:8000
      INSTANCES_INTERNAL_URL: http://instances.loadtest.internal:8000
      CATALOG_TO_INSTANCES_TOKEN: ${CATALOG_TO_INSTANCES_TOKEN:-loadtest-local-catalog-to-instances}
      INSTANCES_TO_CATALOG_TOKEN: ${INSTANCES_TO_CATALOG_TOKEN:-loadtest-local-instances-to-catalog}
      # Prometheus alone (its fixed address below), not the whole subnet: published ports
      # arrive from the subnet's gateway, so a subnet-wide rule would admit the host too.
      METRICS_ALLOWED_CIDRS: 10.95.0.10/32
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      LOADTEST_OWNER_PASSWORD: ${LOADTEST_OWNER_PASSWORD:-loadtest-local-only}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health/')"
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - catalog.loadtest.internal

  instances:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/instances.prod.Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput
      && exec gunicorn --bind :8000 --workers ${LOADTEST_WORKERS:-2} core.wsgi"
    depends_on:
      instances_db:
        condition: service_healthy
      instances_mongo:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.loadtest
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      INSTANCES_DATABASE_URL: ${LOADTEST_INSTANCES_DATABASE_URL:-postgres://appuser:apppassword@instances_db:5432/instancesdb}
      CACHE_REDIS_URL: redis://redis:6379/1
      # The names here are private by suffix, which core.settings.loadtest requires of every entry.
      ALLOWED_HOSTS: localhost,127.0.0.1,api.loadtest.internal,catalog.loadtest.internal,instances.loadtest.internal
      CATALOG_INTERNAL_URL: http://catalog.loadtest.internal:8000
      INSTANCES_INTERNAL_URL: http://instances.loadtest.internal:8000
      CATALOG_TO_INSTANCES_TOKEN: ${CATALOG_TO_INSTANCES_TOKEN:-loadtest-local-catalog-to-instances}
      INSTANCES_TO_CATALOG_TOKEN: ${INSTANCES_TO_CATALOG_TOKEN:-loadtest-local-instances-to-catalog}
      # Prometheus alone (its fixed address below), not the whole subnet: published ports
      # arrive from the subnet's gateway, so a subnet-wide rule would admit the host too.
      METRICS_ALLOWED_CIDRS: 10.95.0.10/32
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      LOADTEST_OWNER_PASSWORD: ${LOADTEST_OWNER_PASSWORD:-loadtest-local-only}
      # Withheld even if .env sets it: this service verifies tokens and never mints them.
      JWT_SIGNING_KEY: ""
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health/')"
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - instances.loadtest.internal

  relay_outbox:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/catalog.prod.Dockerfile
    command: ["python", "manage.py", "relay_outbox"]
    depends_on:
      catalog:
        condition: service_healthy
      instances:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.loadtest
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      INSTANCES_DATABASE_URL: postgres://appuser:apppassword@instances_db:5432/instancesdb
      CACHE_REDIS_URL: redis://redis:6379/1
      # The names here are private by suffix, which core.settings.loadtest requires of every entry.
      ALLOWED_HOSTS: localhost,127.0.0.1,api.loadtest.internal,catalog.loadtest.internal,instances.loadtest.internal
      CATALOG_INTERNAL_URL: http://catalog.loadtest.internal:8000
      INSTANCES_INTERNAL_URL: http://instances.loadtest.internal:8000
      CATALOG_TO_INSTANCES_TOKEN: ${CATALOG_TO_INSTANCES_TOKEN:-loadtest-local-catalog-to-instances}
      INSTANCES_TO_CATALOG_TOKEN: ${INSTANCES_TO_CATALOG_TOKEN:-loadtest-local-instances-to-catalog}
      # Prometheus alone (its fixed address below), not the whole subnet: published ports
      # arrive from the subnet's gateway, so a subnet-wide rule would admit the host too.
      METRICS_ALLOWED_CIDRS: 10.95.0.10/32
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      LOADTEST_OWNER_PASSWORD: ${LOADTEST_OWNER_PASSWORD:-loadtest-local-only}

  gateway:
    build:
      context: ../gateway
      dockerfile: ../docker/gateway.Dockerfile
    ports:
      - "127.0.0.1:8095:8000"
    depends_on:
      catalog:
        condition: service_healthy
      instances:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/api/health/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          # What k6 targets. Private by name.
          - api.loadtest.internal

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - loadtest_prometheus:/prometheus
    ports:
      - "127.0.0.1:9095:9090"
    networks:
      default:
        ipv4_address: 10.95.0.10

  grafana:
    image: grafana/grafana:13.0.9
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/k6.json
      # Read by provisioning/datasources/prometheus.yml.
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - loadtest_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      - prometheus

  # Not started by `up`: `just k6 <scenario>` runs it once per test (`compose run --rm k6`).
  k6:
    image: grafana/k6:2.3.0
    profiles: [k6]
    # Your uid, so the summary JSON it writes to loadtest/results/ is yours.
    user: "${LOADTEST_UID:-1000}"
    working_dir: /loadtest/k6
    volumes:
      - ../../loadtest:/loadtest
    environment:
      BASE_URL: http://api.loadtest.internal:8000
      LOADTEST_OWNER_PASSWORD: ${LOADTEST_OWNER_PASSWORD:-loadtest-local-only}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # Native histograms give true per-minute latency. Trend stats are calculated since the run began.
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    depends_on:
      gateway:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Fixed, so Prometheus has a known address. Clear of Docker's 172.x defaults.
        - subnet: 10.95.0.0/24

volumes:
  loadtest_postgres:
  loadtest_instances_postgres:
  loadtest_instances_mongo:
  loadtest_prometheus:
  loadtest_grafana:
