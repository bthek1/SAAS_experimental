# Dev stack. Paths are relative to this file. Run via `just up` / `just down`, or:
#   docker compose -f infra/docker/docker-compose.yml -p <repo-dir-name> up
services:
  redis:
    image: redis:7-alpine
    ports:
      # Loopback only: the cache deserializes with pickle, so writing to this Redis
      # means running code in the app.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  # This database holds only what instances owns. `db` above is catalog's.
  instances_db:
    image: postgres:16
    environment:
      POSTGRES_DB: instancesdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5437:5432"
    volumes:
      - instances_postgres_data:/var/lib/postgresql/data/

  # instances on MongoDB instead (#29). Only with `--profile mongo`, and used only when
  # `.env` sets INSTANCES_DATABASE_URL to it for a host-run server, or by
  # `core.settings.test_mongo`. A single-node replica set: transactions need one.
  # No auth, so loopback only.
  instances_mongo:
    image: mongo:8
    profiles: [mongo]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - instances_mongo_data:/data/db
    healthcheck:
      # Also initiates the replica set on first start.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/catalog.Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../backend:/app
    ports:
      - "8006:8000"
    depends_on:
      - db
      - redis
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      INSTANCES_DATABASE_URL: postgres://appuser:apppassword@instances_db:5432/instancesdb
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      CATALOG_INTERNAL_URL: http://catalog:8000
      INSTANCES_INTERNAL_URL: http://instances:8000

  instances:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/instances.Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../backend:/app
    ports:
      - "8007:8000"
    depends_on:
      - instances_db
      - redis
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      INSTANCES_DATABASE_URL: postgres://appuser:apppassword@instances_db:5432/instancesdb
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      CATALOG_INTERNAL_URL: http://catalog:8000
      INSTANCES_INTERNAL_URL: http://instances:8000
      # Withheld even if .env sets it: this service verifies tokens and never mints them.
      JWT_SIGNING_KEY: ""

  # Retries type and user events that the immediate push could not deliver.
  relay_outbox:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/catalog.Dockerfile
    command: python manage.py relay_outbox
    volumes:
      - ../../backend:/app
    depends_on:
      - db
      - instances
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      INSTANCES_DATABASE_URL: postgres://appuser:apppassword@instances_db:5432/instancesdb
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      CATALOG_INTERNAL_URL: http://catalog:8000
      INSTANCES_INTERNAL_URL: http://instances:8000

  gateway:
    build:
      context: ../gateway
      dockerfile: ../docker/gateway.Dockerfile
    ports:
      - "8005:8000"
    depends_on:
      - catalog
      - instances

  celery_worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/catalog.Dockerfile
    command: celery -A core worker --loglevel=info --concurrency=2
    volumes:
      - ../../backend:/app
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/1
      # Results go to the Django DB backend (see CELERY_RESULT_BACKEND in
      # core/settings/service.py) so the task-status API and admin can read them.

  celery_beat:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/catalog.Dockerfile
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../../backend:/app
    depends_on:
      - db
      - redis
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgres://appuser:apppassword@db:5432/appdb
      CELERY_BROKER_URL: redis://redis:6379/0
      # Results go to the Django DB backend (see CELERY_RESULT_BACKEND in
      # core/settings/service.py) so the task-status API and admin can read them.

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    command: npm run dev -- --host
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    env_file:
      - path: ../../.env
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:8005

volumes:
  postgres_data:
  instances_postgres_data:
  instances_mongo_data:
