- name: Install Redis (Ubuntu 24.04's own)
  ansible.builtin.apt:
    name: [redis-server]

- name: Configure Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  diff: false  # holds the password
  notify: Restart redis

- name: Start Redis
  ansible.builtin.systemd_service:
    name: redis-server
    enabled: true
    state: started

- name: Install redis_exporter
  ansible.builtin.include_role:
    name: common
    tasks_from: release.yml
  vars:
    common_release_name: redis_exporter
    common_release_url: "{{ redis_exporter_url }}"
    common_release_sha256: "{{ redis_exporter_sha256 }}"
    common_release_binaries: ["redis_exporter-v{{ redis_exporter_version }}.linux-amd64/redis_exporter"]

- name: Create the redis_exporter user
  ansible.builtin.user:
    name: redis_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# In a file, so the password is on no command line.
- name: Write the redis_exporter environment
  ansible.builtin.copy:
    dest: /etc/redis/exporter.env
    owner: root
    group: root
    mode: "0600"
    content: |
      REDIS_ADDR=redis://127.0.0.1:{{ ports.redis }}
      REDIS_PASSWORD={{ redis_password }}
  diff: false  # holds the password
  notify: Restart redis_exporter

- name: Write the redis_exporter unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus redis_exporter (#11)
      After=redis-server.service

      [Service]
      User=redis_exporter
      EnvironmentFile=/etc/redis/exporter.env
      ExecStart=/usr/local/bin/redis_exporter --web.listen-address=:{{ ports.redis_exporter }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: Restart redis_exporter

- name: Start redis_exporter
  ansible.builtin.systemd_service:
    name: redis_exporter
    enabled: true
    state: started
    daemon_reload: true
