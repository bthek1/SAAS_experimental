- name: Restart postgres
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted

- name: Reload postgres
  ansible.builtin.systemd_service:
    name: postgresql
    state: reloaded

- name: Restart postgres_exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter
    state: restarted
    daemon_reload: true
