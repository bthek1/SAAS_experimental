app_root: /srv/app
# Which implementation saas-instances runs (#52): `dotnet` (instances_NET, the default) or
# `go` (instances_GO). Same port, env file, unit and verbs; switch with
# `just converge --tags app --limit instances -e app_instances_impl=go`.
app_instances_impl: dotnet
app_backend_dir: "{{ app_root }}/backend"
app_env_file: "/etc/{{ app_unit }}/app.env"
app_python: "{{ app_backend_dir }}/.venv/bin/python"
# Where the published .NET service lives on the container, and its runtime (#44).
app_dotnet_dir: "{{ app_root }}/instances-dotnet"
app_dotnet: /opt/dotnet/dotnet
# Where the Go binary lives on the container (#52): one static file, no runtime.
app_go_dir: "{{ app_root }}/instances-go"
# Where the commands and the server run. catalog's gunicorn reads gunicorn.conf.py from
# its folder of the synced backend; instances runs from its published build.
app_dir: >-
  {{ app_backend_dir + '/catalog' if app_service == 'catalog'
     else (app_go_dir if app_instances_impl == 'go' else app_dotnet_dir) }}
# Each operation, per service: catalog on FastAPI (#35 to #38), instances on .NET (#44,
# #45). `exe` runs each command.
app_commands:
  catalog:
    exe: "{{ app_python }}"
    migrate: -m catalog migrate
    flush: -m catalog reset-db
    clear_cache: -m catalog clear-cache
    seed: -m catalog seed-loadtest
    relay: -m catalog relay-outbox
    wsgi: -k uvicorn_worker.UvicornWorker catalog.app:app
  instances:
    exe: "{{ app_dotnet }} {{ app_dotnet_dir }}/Instances.Api.dll"
    migrate: migrate
    flush: reset-db
    clear_cache: clear-cache
    seed: seed-loadtest
  # instances in Go (#52): the same verbs, on its own binary.
  instances_go:
    exe: "{{ app_go_dir }}/instances"
    migrate: migrate
    flush: reset-db
    clear_cache: clear-cache
    seed: seed-loadtest
app_cmd: >-
  {{ app_commands['instances_go' if (app_service == 'instances' and app_instances_impl == 'go') else app_service] }}
# PEM files on one line: both services read JWT keys with `\\n` for newlines.
app_jwt_verifying_key: "{{ jwt_verifying_key | trim | replace('\n', '\\n') }}"
app_env_shared:
  SETTINGS: loadtest
  SECRET_KEY: "{{ django_secret_key }}"
  ALLOWED_HOSTS: "{{ guest_ips.gateway }},{{ guest_ip }},localhost,127.0.0.1"
  # Prometheus alone may read /metrics.
  METRICS_ALLOWED_CIDRS: "{{ guest_ips.monitor }}/32"
  CACHE_REDIS_URL: "redis://:{{ redis_password }}@{{ guest_ips.cache }}:{{ ports.redis }}/1"
  CACHE_ENABLED: "{{ cache_enabled }}"
  LOADTEST_OWNER_PASSWORD: "{{ loadtest_owner_password }}"
  JWT_VERIFYING_KEY: "{{ app_jwt_verifying_key }}"
  CATALOG_INTERNAL_URL: "http://{{ guest_ips.app }}:{{ ports.gunicorn }}"
  INSTANCES_INTERNAL_URL: "http://{{ guest_ips.instances }}:{{ ports.gunicorn }}"
  CATALOG_TO_INSTANCES_TOKEN: "{{ catalog_to_instances_token }}"
  INSTANCES_TO_CATALOG_TOKEN: "{{ instances_to_catalog_token }}"
app_env_service:
  catalog:
    # gunicorn's workers share metrics through it (common/gunicorn_conf.py).
    PROMETHEUS_MULTIPROC_DIR: "/run/{{ app_unit }}/prometheus"
    # Rendered on every host (the whole dict is templated), so it needs a default.
    CONN_MAX_AGE: "{{ conn_max_age | default(60) }}"
    DATABASE_URL: "postgres://{{ db_user }}:{{ db_password }}@{{ guest_ips.db }}:{{ ports.postgres }}/{{ db_name }}"
    JWT_SIGNING_KEY: "{{ jwt_signing_key | trim | replace('\n', '\\n') }}"
  # Never the signing key: this service verifies tokens and cannot mint them.
  instances:
    INSTANCES_DATABASE_URL: "postgres://{{ instances_db_user }}:{{ instances_db_password }}@{{ guest_ips.db }}:{{ ports.postgres }}/{{ instances_db_name }}"
# What only instances reads: where it listens, and its tuning knobs. Go reads ASPNETCORE_URLS
# and DB_POOL_SIZE too (#52), and ignores the thread pool's.
app_env_dotnet:
  ASPNETCORE_URLS: "http://0.0.0.0:{{ ports.gunicorn }}"
  DB_POOL_SIZE: "{{ dotnet_db_pool_size | default(20) }}"
  THREADPOOL_MIN_THREADS: "{{ dotnet_min_threads | default(0) }}"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
# The service's environment. Also passed to migrate and the seeders, so they see exactly
# what the server sees.
app_env: >-
  {{ app_env_shared | combine(app_env_service[app_service])
     | combine(app_env_dotnet if app_service == 'instances' else {}) }}
app_manage_env: "{{ app_env | combine({'PROMETHEUS_MULTIPROC_DIR': '/tmp/' + app_unit + '-manage'}) }}"
app_uv_env:
  UV_PYTHON_INSTALL_DIR: "{{ app_root }}/.python"
  UV_CACHE_DIR: "{{ app_root }}/.cache/uv"
  UV_PYTHON_PREFERENCE: only-managed
