- name: Packages
  ansible.builtin.apt:
    name: [acl]

- name: Create the app user
  ansible.builtin.user:
    name: app
    system: true
    home: "{{ app_root }}"
    shell: /usr/sbin/nologin

# catalog is Python, run from the synced backend. instances is .NET (#44, #45): it gets
# only its published build, below.
- name: Source and Python (catalog only)
  when: app_service == 'catalog'
  ansible.builtin.include_tasks: python.yml

# What Django's instances left on saas-instances (#45): its source, venv and Python.
- name: Remove the Django version's files
  when: app_service == 'instances'
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ app_backend_dir }}"
    - "{{ app_root }}/.python"
    - "{{ app_root }}/.cache/uv"

# instances on .NET (#44): the ASP.NET runtime, and the service published on the control host.
- name: .NET runtime
  when: app_service == 'instances' and app_instances_impl == 'dotnet'
  block:
    - name: Download the ASP.NET Core runtime
      ansible.builtin.get_url:
        url: "{{ dotnet_runtime_url }}"
        dest: "/opt/{{ dotnet_runtime_url | basename }}"
        checksum: "sha256:{{ dotnet_runtime_sha256 }}"
        mode: "0644"

    - name: Runtime directory
      ansible.builtin.file:
        path: "/opt/dotnet-{{ dotnet_runtime_version }}"
        state: directory
        mode: "0755"

    # A first --check downloads nothing, so there is nothing to unpack or link yet.
    - name: Unpack the runtime
      ansible.builtin.unarchive:
        src: "/opt/{{ dotnet_runtime_url | basename }}"
        dest: "/opt/dotnet-{{ dotnet_runtime_version }}"
        remote_src: true
        creates: "/opt/dotnet-{{ dotnet_runtime_version }}/dotnet"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Point /opt/dotnet at it
      ansible.builtin.file:
        src: "/opt/dotnet-{{ dotnet_runtime_version }}"
        dest: /opt/dotnet
        state: link
      ignore_errors: "{{ ansible_check_mode }}"
      notify: Restart the service

    # On the control host, into the gitignored publish/ folder. Only a changed build
    # changes what the sync below copies.
    - name: Publish the service (control host)
      ansible.builtin.command: >-
        {{ control_dotnet }} publish {{ repo_root }}/backend/instances_NET/src/Instances.Api
        -c Release -o {{ repo_root }}/backend/instances_NET/publish --nologo
      delegate_to: localhost
      run_once: true
      become: false
      check_mode: false  # a local build, so --check compares against the real output
      changed_when: false

    - name: Published service directory
      ansible.builtin.file:
        path: "{{ app_dotnet_dir }}"
        state: directory
        owner: app
        group: app
        mode: "0755"

    - name: Sync the published service
      ansible.posix.synchronize:
        src: "{{ repo_root }}/backend/instances_NET/publish/"
        dest: "{{ app_dotnet_dir }}/"
        delete: true
        checksum: true
        rsync_opts:
          - --chown=app:app
          - --chmod=Dgo-w,Fgo-w
          # A publish touches its folder; only file contents matter.
          - --omit-dir-times
      notify: Restart the service

# instances in Go (#52): one static binary, built on the control host. -trimpath and no VCS
# stamp make the same source the same bytes, so an unchanged tree syncs nothing.
- name: Go binary
  when: app_service == 'instances' and app_instances_impl == 'go'
  block:
    - name: Build the service (control host)
      ansible.builtin.command:
        cmd: >-
          {{ control_go }} build -trimpath -buildvcs=false
          -o {{ repo_root }}/backend/instances_GO/publish/instances ./cmd/instances
        chdir: "{{ repo_root }}/backend/instances_GO"
      environment:
        CGO_ENABLED: "0"
        GOTOOLCHAIN: local
      delegate_to: localhost
      run_once: true
      become: false
      check_mode: false  # a local build, so --check compares against the real output
      changed_when: false

    - name: Go service directory
      ansible.builtin.file:
        path: "{{ app_go_dir }}"
        state: directory
        owner: app
        group: app
        mode: "0755"

    - name: Sync the Go binary
      ansible.posix.synchronize:
        src: "{{ repo_root }}/backend/instances_GO/publish/"
        dest: "{{ app_go_dir }}/"
        delete: true
        checksum: true
        rsync_opts:
          - --chown=app:app
          - --chmod=Dgo-w,Fgo-w
          - --omit-dir-times
          # go build rewrites the binary every time: compare content (checksum), never mtimes.
          - --no-times
      notify: Restart the service

- name: Environment file directory
  ansible.builtin.file:
    path: "{{ app_env_file | dirname }}"
    state: directory
    owner: root
    group: app
    mode: "0750"

- name: Environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_env_file }}"
    owner: root
    group: app
    mode: "0640"
  diff: false
  no_log: true
  notify: Restart the service

# migrate and seed run outside gunicorn, so their metrics go to a scratch
# directory, never the one gunicorn's on_starting hook owns.
# catalog: Alembic logs "Running upgrade" only when it applies one. Both print "adopted"
# when they take over a database Django built; .NET prints "applied <migration>".
- name: Migrate
  ansible.builtin.command: "{{ app_cmd.exe }} {{ app_cmd.migrate }}"
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_manage_env }}"
  become: true
  become_user: app
  register: app_migrate
  changed_when: >-
    'adopted' in app_migrate.stdout
    or (app_service == 'catalog' and 'Running upgrade' in app_migrate.stderr)
    or (app_service == 'instances' and 'applied ' in app_migrate.stdout)

# `just loadtest-reset`: every run starts from the same data. Runs add rows (the
# respondent flow creates questionnaires), and the unpaginated list got slower
# as they grew, so two runs were not comparable (#9, Phase 5).
- name: Wipe the load-test database (only with -e app_reset_db=true)
  ansible.builtin.command: "{{ app_cmd.exe }} {{ app_cmd.flush }}"
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_manage_env }}"
  become: true
  become_user: app
  when: app_reset_db | bool
  changed_when: true

# Runs must start from the same state, and the owners get new ids below.
- name: Empty the cache (only with -e app_reset_db=true)
  ansible.builtin.command: "{{ app_cmd.exe }} {{ app_cmd.clear_cache }}"
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_manage_env }}"
  become: true
  become_user: app
  when: app_reset_db | bool
  changed_when: true

- name: Write the service's unit (gunicorn, Kestrel for .NET, or the Go binary)
  ansible.builtin.template:
    src: saas-app.service.j2
    dest: "/etc/systemd/system/{{ app_unit }}.service"
    mode: "0644"
  notify: Restart the service

- name: Start the service
  ansible.builtin.systemd_service:
    name: "{{ app_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Health check
  ansible.builtin.uri:
    url: "http://localhost:{{ ports.gunicorn }}/internal/health/"
  register: app_health
  check_mode: false  # read-only; also proves the service in --check runs
  until: app_health.status == 200
  retries: 20
  delay: 2

# After the health check: delivery needs both services up.
- name: Seed and relay (catalog only)
  ansible.builtin.include_tasks: catalog.yml
  when: app_service == 'catalog'
