- name: Packages (instances also needs WeasyPrint's libraries, for PDF export, and a font)
  ansible.builtin.apt:
    name: "{{ ['acl'] + (['libpango-1.0-0', 'libpangoft2-1.0-0', 'libharfbuzz0b', 'fonts-dejavu-core'] if app_service == 'instances' else []) }}"

- name: Create the app user
  ansible.builtin.user:
    name: app
    system: true
    home: "{{ app_root }}"
    shell: /usr/sbin/nologin

- name: Install uv
  ansible.builtin.include_role:
    name: common
    tasks_from: release.yml
  vars:
    common_release_name: uv
    common_release_url: "{{ uv_url }}"
    common_release_sha256: "{{ uv_sha256 }}"
    common_release_binaries: [uv-x86_64-unknown-linux-gnu/uv]

- name: Backend directory
  ansible.builtin.file:
    path: "{{ app_backend_dir }}"
    state: directory
    owner: app
    group: app
    mode: "0755"

# The working tree, not a commit: what you test is what you have checked out.
# Excluded paths on the container (.venv) are kept despite --delete.
- name: Sync the backend source
  ansible.posix.synchronize:
    src: "{{ repo_root }}/backend/"
    dest: "{{ app_backend_dir }}/"
    delete: true
    rsync_opts:
      - --chown=app:app
      # The checkout is 0775/0664; on the container nothing but app may write.
      - --chmod=Dgo-w,Fgo-w
      - --exclude=.venv
      # Perishable: never stops rsync deleting a directory that is otherwise gone.
      - --filter=-p___pycache__  # "-p", "_" for the space, then the name
      # uv builds common's on the container, and --delete would remove it each run.
      - --exclude=*.egg-info
      - --exclude=.pytest_cache
      - --exclude=.ruff_cache
      - --exclude=.mypy_cache
      - --exclude=.coverage
      - --exclude=htmlcov
      - --exclude=*.sqlite3
      - --exclude=staticfiles
      - --exclude=media
      - --exclude=.env
  notify: Restart the service

- name: Install the backend's dependencies (Python 3.14 managed by uv)
  ansible.builtin.command: "uv sync --frozen --no-dev --package {{ app_service }} --python 3.14"
  args:
    chdir: "{{ app_backend_dir }}"
  environment: "{{ app_uv_env }}"
  become: true
  become_user: app
  register: app_uv_sync
  changed_when: "'Installed' in app_uv_sync.stderr or 'Uninstalled' in app_uv_sync.stderr"
  notify: Restart the service

- name: Environment file directory
  ansible.builtin.file:
    path: "{{ app_env_file | dirname }}"
    state: directory
    owner: root
    group: app
    mode: "0750"

- name: Environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_env_file }}"
    owner: root
    group: app
    mode: "0640"
  diff: false
  no_log: true
  notify: Restart the service

# migrate and seed run outside gunicorn, so their metrics go to a scratch
# directory, never the one gunicorn's on_starting hook owns.
- name: Migrate
  ansible.builtin.command: "{{ app_python }} manage.py migrate --noinput"
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_manage_env }}"
  become: true
  become_user: app
  register: app_migrate
  changed_when: "'No migrations to apply' not in app_migrate.stdout"

# `just loadtest-reset`: every run starts from the same data. Runs add rows (the
# respondent flow creates questionnaires), and the unpaginated list got slower
# as they grew, so two runs were not comparable (#9, Phase 5).
- name: Wipe the load-test database (only with -e app_reset_db=true)
  ansible.builtin.command: "{{ app_python }} manage.py flush --noinput"
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_manage_env }}"
  become: true
  become_user: app
  when: app_reset_db | bool
  changed_when: true

# Runs must start from the same state, and the owners get new ids below.
- name: Empty the cache (only with -e app_reset_db=true)
  ansible.builtin.command:
    argv:
      - "{{ app_python }}"
      - manage.py
      - shell
      - -c
      - from django.core.cache import cache; cache.clear()
  args:
    chdir: "{{ app_dir }}"
  environment: "{{ app_manage_env }}"
  become: true
  become_user: app
  when: app_reset_db | bool
  changed_when: true

- name: Write the service's unit (gunicorn)
  ansible.builtin.template:
    src: saas-app.service.j2
    dest: "/etc/systemd/system/{{ app_unit }}.service"
    mode: "0644"
  notify: Restart the service

- name: Start the service
  ansible.builtin.systemd_service:
    name: "{{ app_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Health check
  ansible.builtin.uri:
    url: "http://localhost:{{ ports.gunicorn }}/internal/health/"
  register: app_health
  check_mode: false  # read-only; also proves the service in --check runs
  until: app_health.status == 200
  retries: 20
  delay: 2

# After the health check: delivery needs both services up.
- name: Seed and relay (catalog only)
  ansible.builtin.include_tasks: catalog.yml
  when: app_service == 'catalog'
