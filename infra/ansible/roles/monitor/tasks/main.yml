- name: Create the prometheus user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install Prometheus and promtool
  ansible.builtin.include_role:
    name: common
    tasks_from: release.yml
  vars:
    common_release_name: prometheus
    common_release_url: "{{ prometheus_url }}"
    common_release_sha256: "{{ prometheus_sha256 }}"
    common_release_binaries:
      - "prometheus-{{ prometheus_version }}.linux-amd64/prometheus"
      - "prometheus-{{ prometheus_version }}.linux-amd64/promtool"

- name: Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: prometheus
    mode: "0755"
  loop:
    - {path: /etc/prometheus, owner: root}
    - {path: /var/lib/prometheus, owner: prometheus}

# The same alert rules as the local stack (infra/observability/prometheus/).
- name: Alert rules
  ansible.builtin.copy:
    src: "{{ repo_root }}/infra/observability/prometheus/rules.yml"
    dest: /etc/prometheus/rules.yml
    mode: "0644"
    validate: promtool check rules %s
  notify: Restart prometheus

- name: Scrape config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
    validate: promtool check config --syntax-only %s
  notify: Restart prometheus

- name: Prometheus unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus (#9): scrapes the containers, receives k6 by remote write
      After=network-online.target

      [Service]
      User=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --storage.tsdb.retention.time=30d \
        --web.listen-address=:{{ ports.prometheus }} \
        --web.enable-remote-write-receiver
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: Restart prometheus

- name: Start Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Download Grafana
  ansible.builtin.get_url:
    url: "{{ grafana_url }}"
    dest: "/opt/grafana_{{ grafana_version }}_amd64.deb"
    checksum: "sha256:{{ grafana_sha256 }}"
    mode: "0644"

# Settings before the first start: the admin password only takes effect when
# Grafana creates its database.
- name: Grafana drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: Grafana settings (systemd drop-in)
  ansible.builtin.template:
    src: grafana-loadtest.conf.j2
    dest: /etc/systemd/system/grafana-server.service.d/loadtest.conf
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart grafana

- name: Install Grafana
  ansible.builtin.apt:
    deb: "/opt/grafana_{{ grafana_version }}_amd64.deb"

- name: Grafana provisioning (the local stack's, unchanged)
  ansible.builtin.copy:
    src: "{{ repo_root }}/infra/observability/grafana/provisioning/{{ item }}/"
    dest: "/etc/grafana/provisioning/{{ item }}/"
    owner: root
    group: grafana
    mode: "0644"
    directory_mode: "0755"
  loop: [datasources, dashboards]
  notify: Restart grafana

- name: Grafana dashboards (generated by build_dashboards.py)
  ansible.builtin.copy:
    src: "{{ repo_root }}/infra/observability/grafana/dashboards/"
    dest: /var/lib/grafana/dashboards/
    owner: root
    group: grafana
    mode: "0644"
    directory_mode: "0755"

- name: Start Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true

- name: Apply restarts before the checks
  ansible.builtin.meta: flush_handlers

- name: Grafana is up
  ansible.builtin.uri:
    url: "http://localhost:{{ ports.grafana }}/api/health"
  register: monitor_grafana_health
  check_mode: false  # read-only; also proves the service in --check runs
  until: monitor_grafana_health.status == 200
  retries: 30
  delay: 2
