- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: Restart container-metrics timer
  ansible.builtin.systemd_service:
    name: container-metrics.timer
    state: restarted
    daemon_reload: true
