# MongoDB for instances, to compare with Postgres on saas-db (#30). From MongoDB's own
# apt repository: Ubuntu's has no MongoDB. Its signing key is pinned by sha256, and the
# packages by version, in group_vars/all.yml.
- name: Keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: MongoDB's signing key
  ansible.builtin.get_url:
    url: "{{ mongodb_key_url }}"
    dest: /etc/apt/keyrings/mongodb-server.asc
    checksum: "sha256:{{ mongodb_key_sha256 }}"
    mode: "0644"

- name: MongoDB's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/mongodb-server.asc]
      https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/{{ mongodb_series }} multiverse
    filename: mongodb-org
    state: present

- name: Install MongoDB and mongosh (pinned)
  ansible.builtin.apt:
    name:
      - "mongodb-org-server={{ mongodb_version }}"
      - "mongodb-mongosh={{ mongosh_version }}"

- name: Key file directory
  ansible.builtin.file:
    path: /etc/mongodb
    state: directory
    owner: mongodb
    group: mongodb
    mode: "0700"

- name: Replica set key file
  ansible.builtin.copy:
    dest: /etc/mongodb/keyfile
    content: "{{ mongo_keyfile }}\n"
    owner: mongodb
    group: mongodb
    mode: "0400"
  diff: false  # a secret
  no_log: true
  notify: Restart mongod

- name: Configure mongod
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    mode: "0644"
  notify: Restart mongod

- name: Start mongod
  ansible.builtin.systemd_service:
    name: mongod
    enabled: true
    state: started

- name: Apply restarts before setup
  ansible.builtin.meta: flush_handlers

- name: Wait for mongod
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ports.mongodb }}"
    timeout: 60

- name: Setup script
  ansible.builtin.copy:
    src: setup.js
    dest: /etc/mongodb/setup.js
    owner: root
    group: root
    mode: "0600"

- name: Replica set and users
  ansible.builtin.command: mongosh --quiet --host 127.0.0.1 --port {{ ports.mongodb }} --file /etc/mongodb/setup.js
  environment:
    MONGO_PORT: "{{ ports.mongodb }}"
    MONGO_REPLICA_SET: "{{ mongo_replica_set }}"
    MONGO_MEMBER: "{{ guest_ip }}:{{ ports.mongodb }}"
    MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
    MONGO_INSTANCES_DB: "{{ instances_db_name }}"
    MONGO_INSTANCES_USER: "{{ mongo_instances_user }}"
    MONGO_INSTANCES_PASSWORD: "{{ mongo_instances_password }}"
    MONGO_EXPORTER_PASSWORD: "{{ mongo_exporter_password }}"
  register: mongodb_setup
  changed_when: "'CHANGED' in mongodb_setup.stdout"
  no_log: true

- name: Install mongodb_exporter
  ansible.builtin.include_role:
    name: common
    tasks_from: release.yml
  vars:
    common_release_name: mongodb_exporter
    common_release_url: "{{ mongodb_exporter_url }}"
    common_release_sha256: "{{ mongodb_exporter_sha256 }}"
    common_release_binaries: ["mongodb_exporter-{{ mongodb_exporter_version }}.linux-amd64/mongodb_exporter"]

- name: Create the mongodb_exporter user
  ansible.builtin.user:
    name: mongodb_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# In a file, so the password is on no command line.
- name: Write the mongodb_exporter environment
  ansible.builtin.copy:
    dest: /etc/mongodb/exporter.env
    owner: root
    group: root
    mode: "0600"
    content: |
      MONGODB_URI=mongodb://exporter:{{ mongo_exporter_password }}@127.0.0.1:{{ ports.mongodb }}/admin?directConnection=true
  diff: false  # holds the password
  no_log: true
  notify: Restart mongodb_exporter

- name: Write the mongodb_exporter unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/mongodb_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus mongodb_exporter (#30)
      After=mongod.service

      [Service]
      User=mongodb_exporter
      EnvironmentFile=/etc/mongodb/exporter.env
      ExecStart=/usr/local/bin/mongodb_exporter --web.listen-address=:{{ ports.mongodb_exporter }} --collect-all --compatible-mode
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: Restart mongodb_exporter

- name: Start mongodb_exporter
  ansible.builtin.systemd_service:
    name: mongodb_exporter
    enabled: true
    state: started
    daemon_reload: true
