# The load-test deploy on the Proxmox LXC containers (#9, Phase 4).
#   just converge                 # everything
#   just converge --tags app      # one role
- name: Base (all containers)
  hosts: all
  roles:
    - {role: common, tags: [common]}

- name: Database (saas-db)
  hosts: db
  roles:
    - {role: postgres, tags: [db]}

- name: MongoDB for instances (saas-mongo, issue 30)
  hosts: mongo
  roles:
    - {role: mongodb, tags: [mongo]}

- name: Redis cache (saas-cache)
  hosts: cache
  roles:
    - {role: redis, tags: [cache]}

# Instances first: catalog's seed pushes events to it.
- name: Instances service (saas-instances)
  hosts: instances
  roles:
    - {role: app, tags: [app, instances]}

- name: Catalog service (saas-catalog)
  hosts: app
  roles:
    - {role: app, tags: [app, catalog]}

- name: Seed instances from the copies (saas-instances)
  hosts: instances
  tasks:
    - name: Seed
      ansible.builtin.include_role:
        name: app
        tasks_from: seed_instances.yml
        apply:
          tags: [app, instances]
      tags: [app, instances]

- name: Gateway (saas-gateway)
  hosts: gateway
  roles:
    - {role: gateway, tags: [gateway]}

- name: Prometheus + Grafana (saas-monitor)
  hosts: monitor
  roles:
    - {role: monitor, tags: [monitor]}

- name: K6 load generator (saas-loadgen)
  hosts: loadgen
  roles:
    - {role: loadgen, tags: [loadgen]}
