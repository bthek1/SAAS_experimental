# Redis: the two services alone, with separate key prefixes. Writing to it means running code in the app (the cache
# deserializes with pickle), so the firewall and the password both stay. #11.
nft_rules:
  - {port: "{{ ports.redis }}", from: ["{{ guest_ips.app }}", "{{ guest_ips.instances }}"]}
  - {port: "{{ ports.redis_exporter }}", from: ["{{ guest_ips.monitor }}"]}

redis_maxmemory: 256mb
