# The instances service (#13). Its address: the gateway, catalog (/internal/), and the scraper.
nft_rules:
  - port: "{{ ports.gunicorn }}"
    from: "{{ [guest_ips.gateway, guest_ips.app, guest_ips.monitor] }}"

app_service: instances
app_unit: saas-instances
# instances runs on .NET (#44, #45). Tuning: database connections in Npgsql's pool,
# and threads the pool keeps ready (0: the runtime's default, one per core).
dotnet_db_pool_size: 20
dotnet_min_threads: 0
cache_enabled: true
loadtest_questionnaires_per_owner: 200
app_reset_db: false
