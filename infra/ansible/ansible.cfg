# Ansible for the load-test LXC containers (#9, Phase 4). Run from this folder,
# or through `just converge`.
[defaults]
inventory = inventory/pulumi.py
roles_path = roles
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml
# Secrets come from the inventory; never write them into the fact cache.
fact_caching = memory
forks = 4

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o SetEnv=LC_ALL=C.UTF-8
